<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A853"/>
      <stop offset="50%" stop-color="#B8862E"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C874"/>
      <stop offset="50%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#B8862E"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" stroke="url(#gold-grad)" stroke-width="3" fill="none"/>
  <circle cx="100" cy="100" r="88" stroke="url(#gold-light)" stroke-width="1.5" fill="none"/>
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="70" stroke="url(#gold-grad)" stroke-width="2" fill="none"/>
  <!-- DK monogram -->
  <text x="100" y="118" text-anchor="middle" font-family="serif" font-size="60" font-weight="bold" font-style="italic" fill="url(#gold-grad)">dk</text>
  <!-- Top text: DIVINE KARIGARI -->
  <path id="topArc" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <text font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="url(#gold-grad)">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">DIVINE KARIGARI</textPath>
  </text>
  <!-- Bottom text: ARTISTRY & SPIRIT -->
  <path id="bottomArc" d="M 30,100 A 70,70 0 0,0 170,100" fill="none"/>
  <text font-family="sans-serif" font-size="10" font-weight="500" letter-spacing="2" fill="url(#gold-grad)">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">ARTISTRY &amp; SPIRIT</textPath>
  </text>
</svg>
